apiVersion: v1
kind: Service
metadata:
  name: riverlake-help-backend
  namespace: riverlake-help-ns
  labels:
    app: riverlake-help-backend
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app: riverlake-help-backend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: riverlake-help-backend
  namespace: riverlake-help-ns
  labels:
    app: riverlake-help-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: riverlake-help-backend
  template:
    metadata:
      labels:
        app: riverlake-help-backend
        version: v1
    spec:
      containers:
        - name: riverlake-help-backend
          image: k8s-node-1:5000/riverlake-help-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /api/hello
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/hello
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
