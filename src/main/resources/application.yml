server:
  port: 8080

spring:
  application:
    name: riverlake-help-backend

  datasource:
    url: jdbc:h2:mem:riverlake
    driver-class-name: org.h2.Driver
    username: sa
    password: 

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  cors:
    allowed-origins: "*"
    allowed-methods: GET,POST,PUT,DELETE,OPTIONS
    allowed-headers: "*"
    allow-credentials: false
    max-age: 3600

jwt:
  secret: RiverLakeHelpSecretKey2024MustBeAtLeast256BitsLong!
  expiration: 86400000

logging:
  level:
    com.riverlake: debug
    org.springframework.web: info
