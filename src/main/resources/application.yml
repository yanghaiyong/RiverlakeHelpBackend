server:
  port: 8080

spring:
  application:
    name: riverlake-help-backend

  cors:
    allowed-origins: "*"
    allowed-methods: GET,POST,PUT,DELETE,OPTIONS
    allowed-headers: "*"
    allow-credentials: false
    max-age: 3600

logging:
  level:
    com.riverlake: debug
    org.springframework.web: info
